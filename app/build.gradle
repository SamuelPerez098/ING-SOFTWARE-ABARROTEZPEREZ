plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.ing_software_abarrotezperez'

    compileSdk 34

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE.txt',
                    'META-INF/INDEX.LIST'
            ]
        }
    }

    defaultConfig {
        applicationId "com.example.ing_software_abarrotezperez"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.material

    implementation "androidx.cardview:cardview:1.0.0"

    // Código de barras
    implementation 'com.google.zxing:core:3.4.1'

    // Gráficas
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Google Drive API


    // GIFs
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit

    // ── NUEVAS DEPENDENCIAS PARA GOOGLE DRIVE ────────────────────

    // Google Sign-In (autenticación OAuth con cuenta Google)
    implementation("com.google.android.gms:play-services-auth:21.2.0")

    // Cliente HTTP de Google para Android (gestiona tokens OAuth)
    implementation("com.google.api-client:google-api-client-android:2.2.0")

    // Servicio de Drive API v3 (clases Drive, DriveFile, DriveScopes…)
    implementation("com.google.apis:google-api-services-drive:v3-rev20240521-2.0.0")

    // Parser JSON GSON (requerido por el cliente API de Google)
    implementation("com.google.http-client:google-http-client-gson:1.44.1")

    // Coroutines para ejecutar la subida en Dispatchers.IO
    // (probablemente ya la tienes por WorkManager; verifica antes de duplicar)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
}
